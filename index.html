<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rail Shooter</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="stage">
    <canvas id="game"></canvas>

    <div id="overlay" class="screen">
      <div class="panel">
        <h1>RAIL SHOOTER</h1>
        <p class="sub">Prototype 2.5D pour Sinden Light Gun</p>
        <div class="controls">
          <div><span class="key">Gâchette</span> tirer</div>
          <div><span class="key">Pédale / Espace</span> sortir de la cachette (maintenir)</div>
          <div><span class="key">Hors écran / Clic droit / R</span> recharger</div>
          <div><span class="key">Échap</span> pause</div>
        </div>
        <div class="row">
          <button id="btn-start" class="primary">DÉMARRER</button>
        </div>
        <div class="row small">
          <label class="chk"><input type="checkbox" id="chk-fs" checked> Plein écran</label>
          <label class="chk"><input type="checkbox" id="chk-toggle"> Pédale en bascule</label>
        </div>
      </div>
    </div>

    <div id="pause" class="screen hidden">
      <div class="panel">
        <h2>PAUSE</h2>
        <div class="row">
          <button id="btn-resume" class="primary">REPRENDRE</button>
          <button id="btn-quit">MENU</button>
        </div>
      </div>
    </div>

    <div id="result" class="screen hidden">
      <div class="panel">
        <h2 id="result-title">MISSION TERMINÉE</h2>
        <p id="result-score" class="sub"></p>
        <p id="result-path" class="sub tiny"></p>
        <div class="row"><button id="btn-again" class="primary">REJOUER</button></div>
      </div>
    </div>

</div>
<script type="module" src="src/main.js"></script>
</body>
</html>
